name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git zip unzip openjdk-17-jdk python3-pip libffi-dev libssl-dev libltdl-dev libncurses6 autoconf automake libtool pkg-config

      - name: Install fixed Python dependencies
        run: |
          python -m pip install --upgrade "pip<24.1" "setuptools<70.0.0"
          python -m pip install "cython==0.29.36" "buildozer==1.5.0"

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: bin/*.apk
